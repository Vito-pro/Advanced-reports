mysql:
  host: localhost
  port: 3306
  database: minecraft
  username: root
  password: change-me
  ssl: false

cooldown-seconds: 60

reasons:
  free: true
  max-length: 20
  presets:
    - Cheating
    - Griefing
    - Chat abuse
    - Spamming
    - Exploiting
    - Other

display:
  time-zone: Europe/Berlin
  date-format: dd.MM.yyyy HH:mm
  refresh-ticks: 40
  colors:
    title-start: '#FD0000'
    title-end: '#FF2829'
    player-title: '#E22400'
    text: '#FFFFFF'
    muted: '#5C5C5C'
    active: '#3DFF7C'
    danger: '#FF2021'

messages:
  prefix: '<gradient:#FD0000:#FF2829>ᴀᴅᴠᴀɴᴄᴇᴅ ʀᴇᴘᴏʀᴛꜱ</gradient> <white>'
  no-permission: '<red>ʏᴏᴜ ᴅᴏ ɴᴏᴛ ʜᴀᴠᴇ ᴘᴇʀᴍɪꜱꜱɪᴏɴ.</red>'
  players-only: '<red>ᴛʜɪꜱ ᴄᴏᴍᴍᴀɴᴅ ᴍᴜꜱᴛ ʙᴇ ᴜꜱᴇᴅ ɪɴ ɢᴀᴍᴇ.</red>'
  starting: '<yellow>ᴛʜᴇ ʀᴇᴘᴏʀᴛ ꜱʏꜱᴛᴇᴍ ɪꜱ ꜱᴛɪʟʟ ꜱᴛᴀʀᴛɪɴɢ.</yellow>'
  database-error: '<red>ᴛʜᴇ ʀᴇᴘᴏʀᴛ ꜱʏꜱᴛᴇᴍ ᴄᴏᴜʟᴅ ɴᴏᴛ ᴄᴏᴍᴘʟᴇᴛᴇ ᴛʜᴀᴛ ᴀᴄᴛɪᴏɴ.</red>'
  report-usage: '<red>ᴜꜱᴀɢᴇ: /report player [reason]</red>'
  unknown-player: '<red>ᴘʟᴀʏᴇʀ ɴᴏᴛ ꜰᴏᴜɴᴅ. ᴛʜᴇʏ ᴍᴜꜱᴛ ʜᴀᴠᴇ ᴊᴏɪɴᴇᴅ ᴛʜɪꜱ ꜱᴇʀᴠᴇʀ.</red>'
  self-report: '<red>ʏᴏᴜ ᴄᴀɴɴᴏᴛ ʀᴇᴘᴏʀᴛ ʏᴏᴜʀꜱᴇʟꜰ.</red>'
  reason-too-long: '<red>ʀᴇᴀꜱᴏɴ ᴍᴜꜱᴛ ʙᴇ <limit> ᴄʜᴀʀᴀᴄᴛᴇʀꜱ ᴏʀ ꜰᴇᴡᴇʀ.</red>'
  invalid-reason: '<red>ᴄʜᴏᴏꜱᴇ ᴀ ʀᴇᴀꜱᴏɴ ꜰʀᴏᴍ ᴛʜᴇ ʟɪꜱᴛ: <reasons></red>'
  duplicate: '<red>ʏᴏᴜ ᴀʟʀᴇᴀᴅʏ ʀᴇᴘᴏʀᴛᴇᴅ ᴛʜɪꜱ ᴘʟᴀʏᴇʀ ꜰᴏʀ ᴛʜᴀᴛ ʀᴇᴀꜱᴏɴ.</red>'
  cooldown: '<red>ᴘʟᴇᴀꜱᴇ ᴡᴀɪᴛ <seconds> ꜱᴇᴄᴏɴᴅꜱ ʙᴇꜰᴏʀᴇ ʏᴏᴜʀ ɴᴇxᴛ ʀᴇᴘᴏʀᴛ.</red>'
  submitted: '<white>ʏᴏᴜʀ ʀᴇᴘᴏʀᴛ ᴡᴀꜱ ꜱᴜʙᴍɪᴛᴛᴇᴅ. ꜱᴛᴀꜰꜰ ᴡɪʟʟ ʟᴏᴏᴋ ɪɴᴛᴏ ɪᴛ ꜱᴏᴏɴ.</white>'
  staff-notification: '<red><bold>ɴᴇᴡ ʀᴇᴘᴏʀᴛ</bold></red> <white><player> ᴡᴀꜱ ʀᴇᴘᴏʀᴛᴇᴅ ʙʏ <reporter>. ʀᴇᴀꜱᴏɴ: <reason>. ᴛᴏᴛᴀʟ ʀᴇᴘᴏʀᴛꜱ: <total>.</white>'
  delete-success: '<white>ʀᴇᴘᴏʀᴛ <number> ᴡᴀꜱ ᴅᴇʟᴇᴛᴇᴅ.</white>'
  report-not-found: '<red>ᴛʜɪꜱ ʀᴇᴘᴏʀᴛ ʜᴀꜱ ᴀʟʀᴇᴀᴅʏ ʙᴇᴇɴ ᴅᴇʟᴇᴛᴇᴅ.</red>'
  player-offline: '<red>ᴘʟᴀʏᴇʀ ᴏꜰꜰʟɪɴᴇ.</red>'
  teleported: '<white>ᴛᴇʟᴇᴘᴏʀᴛᴇᴅ ᴛᴏ <player>.</white>'
  teleported-here: '<white>ᴛᴇʟᴇᴘᴏʀᴛᴇᴅ <player> ᴛᴏ ʏᴏᴜ.</white>'
  copy-name: '<white>ᴄʟɪᴄᴋ ᴛᴏ ᴄᴏᴘʏ <player>.</white>'
